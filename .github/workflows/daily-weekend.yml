name: Daily weekend board

# Rebuilds the published site every day so the phone landing page (docs/index.html — the
# "This weekend" board) is always fresh without anyone triggering anything by hand. The board is
# regenerated from data/places.json + data/visits.jsonl (both tracked); the private taste profile
# and suggestions log are gitignored, so in CI the picks come from the deterministic core
# (Michelin-DNA · value · near-home), minus places visited in the last few weeks.

on:
  schedule:
    # 04:12 UTC daily ≈ 05:12–06:12 in Stockholm — done before the user wakes up.
    # (Off-the-hour minute: GitHub delays/drops jobs scheduled exactly on :00.)
    - cron: "12 4 * * *"
  workflow_dispatch: {}   # allow a manual rebuild from the Actions tab

# Don't let a slow run overlap the next day's run.
concurrency:
  group: daily-weekend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the published site (weekend board + full map)
        run: node scripts/build_site.mjs

      - name: Commit & push if the board changed
        run: |
          git config user.name "food-map-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No change to the published site today."
          else
            git commit -m "chore(weekend): refresh this-weekend board [skip ci]"
            git push
          fi

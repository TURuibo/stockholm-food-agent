<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockholm Food Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;450;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#f3efe7; --panel:#fffdf9; --panel-2:#f8f4ec;
    --ink:#1f1e1b; --muted:#8c8579; --faint:#aaa395; --line:#e7e0d3;
    --gold:#b08d4f; --gold-soft:#c9aa6c; --gold-bg:#f6efe1;
    --accent:#9c1733; --accent-deep:#7d0f27; --green:#2f7d4f;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 6px 24px rgba(40,33,20,.10);
    --shadow-lg:-8px 0 40px rgba(40,33,20,.16);
    --sidebar-w:344px; --detail-w:392px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:var(--sans);color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  ::selection{background:var(--gold-soft);color:#fff;}
  /* refined scrollbars */
  *{scrollbar-width:thin;scrollbar-color:#d8cfbd transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-thumb{background:#d8cfbd;border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  *::-webkit-scrollbar-thumb:hover{background:#c7bca5;background-clip:content-box;}

  #app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:auto 1fr;height:100%;}

  /* ---- top bar ---- */
  header{grid-column:1 / -1;display:flex;align-items:center;gap:18px;padding:13px 22px;
    background:linear-gradient(180deg,#fffefb,#fbf7ef);border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(176,141,79,.18);z-index:500;position:relative;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);opacity:.5;}
  header .brand{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap;}
  header .brand .bname{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.01em;color:var(--ink);}
  header .brand .bname .fork{color:var(--gold);font-size:19px;margin-right:7px;}
  header .brand small{font-size:11px;font-weight:450;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;}
  header .search{flex:1;max-width:440px;position:relative;}
  header .search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:11px;
    font-family:var(--sans);font-size:14px;background:var(--panel);color:var(--ink);transition:border-color .15s,box-shadow .15s;}
  header .search input:focus{outline:none;border-color:var(--gold-soft);box-shadow:0 0 0 3px rgba(201,170,108,.18);}
  header .search::before{content:"⌕";position:absolute;left:13px;top:6px;font-size:19px;color:var(--gold);opacity:.85;}
  header .count{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right;letter-spacing:.04em;text-transform:uppercase;}
  header .count b{display:block;color:var(--ink);font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:0;}
  #resetBtn{font-family:var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:10px;padding:9px 14px;font-size:12px;letter-spacing:.03em;cursor:pointer;transition:all .15s;}
  #resetBtn:hover{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-soft);}

  /* ---- sidebar ---- */
  aside{grid-row:2;grid-column:1;display:flex;flex-direction:column;border-right:1px solid var(--line);
    background:var(--panel);min-height:0;}
  .filters{padding:16px 18px;border-bottom:1px solid var(--line);overflow-y:auto;max-height:47%;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));}
  .filters .fgroup{margin-bottom:15px;}
  .filters label.flabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.13em;
    color:var(--gold);margin-bottom:8px;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:var(--sans);font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;user-select:none;line-height:1.4;transition:all .14s;}
  .chip:hover{border-color:var(--gold-soft);color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--ink);color:#f6efe1;border-color:var(--ink);}
  .chip.vibe[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff;}
  .row{display:flex;gap:8px;align-items:center;}
  .row select{flex:1;font-family:var(--sans);padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .row select:focus{outline:none;border-color:var(--gold-soft);}
  .slider-val{font-size:12px;color:var(--muted);min-width:58px;text-align:right;font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;accent-color:var(--gold);}

  /* ---- list ---- */
  .listwrap{flex:1;overflow-y:auto;min-height:0;}
  .listhead{padding:11px 18px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);
    position:sticky;top:0;background:rgba(255,253,249,.94);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);z-index:2;}
  .card{padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s;position:relative;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .14s;}
  .card:hover,.card.hot{background:var(--panel-2);}
  .card.active{background:var(--gold-bg);}
  .card.active::before{background:linear-gradient(180deg,var(--gold-soft),var(--gold));}
  .card .ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .card .cname{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.01em;color:var(--ink);}
  .card .cdist{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .card .cmeta{font-size:12px;color:var(--muted);margin-top:3px;}
  .card .crank{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:600;
    border-radius:50%;width:19px;height:19px;line-height:19px;text-align:center;margin-right:7px;vertical-align:middle;
    font-family:var(--sans);box-shadow:0 1px 3px rgba(156,23,51,.35);}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:9.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:#fff;margin-right:5px;vertical-align:middle;}

  /* ---- map ---- */
  #map{grid-row:2;grid-column:2;height:100%;min-height:0;background:#eae4d8;}
  .leaflet-container{font-family:var(--sans);}
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:var(--shadow);}
  .leaflet-popup-content{margin:11px 14px;font-size:13px;}
  .leaflet-control-zoom a{border-radius:9px !important;color:var(--ink) !important;border:1px solid var(--line) !important;}
  .leaflet-bar{box-shadow:var(--shadow) !important;border:none !important;}
  .leaflet-tooltip{font-family:var(--serif);font-size:14px;font-weight:600;border:none;border-radius:8px;
    box-shadow:var(--shadow);color:var(--ink);padding:4px 10px;}

  /* ---- detail drawer ---- */
  #detail{position:fixed;top:0;right:0;height:100%;width:var(--detail-w);max-width:94vw;background:var(--panel);
    box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);
    z-index:1000;display:flex;flex-direction:column;}
  #detail.open{transform:translateX(0);}
  #detail .dhead{padding:22px 24px 16px;position:relative;
    background:linear-gradient(180deg,var(--gold-bg),var(--panel));border-bottom:1px solid var(--line);}
  #detail .dhead::after{content:"";position:absolute;left:24px;right:24px;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--gold-soft),transparent);}
  #detail .dclose{position:absolute;top:16px;right:18px;border:1px solid var(--line);background:var(--panel);
    width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;
    display:flex;align-items:center;justify-content:center;transition:all .15s;}
  #detail .dclose:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  #detail h2{margin:0 34px 9px 0;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.08;letter-spacing:.01em;}
  #detail .dbody{padding:18px 24px 28px;overflow-y:auto;flex:1;}
  #detail .why{background:linear-gradient(135deg,#eef6f0,#e6f2ea);border-left:3px solid var(--green);
    color:#1f5c3a;padding:11px 14px;border-radius:9px;font-size:13.5px;margin-bottom:18px;}
  #detail .note{font-family:var(--serif);font-size:17px;line-height:1.5;color:#3a352c;margin-bottom:20px;font-weight:500;}
  .kv{display:grid;grid-template-columns:104px 1fr;gap:0;font-size:13px;margin-bottom:18px;}
  .kv dt{color:var(--muted);padding:8px 0;border-top:1px solid var(--line);letter-spacing:.02em;}
  .kv dd{margin:0;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);}
  .kv dt:first-of-type,.kv dt:first-of-type + dd{border-top:none;}
  .dnabar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:7px;}
  .dnabar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--accent));}
  .dlinks{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;}
  .dlinks a{font-size:12.5px;font-weight:500;text-decoration:none;padding:9px 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);color:var(--ink);transition:all .15s;letter-spacing:.01em;}
  .dlinks a:hover{background:var(--ink);color:var(--gold-bg);border-color:var(--ink);transform:translateY(-1px);}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .vchips span{font-size:11px;background:var(--gold-bg);color:var(--gold);border:1px solid #ecdfc6;
    padding:3px 10px;border-radius:999px;letter-spacing:.02em;}

  /* ---- review form ---- */
  details.review{margin-top:22px;border:1px solid #ece3d2;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,var(--gold-bg),var(--panel-2));box-shadow:0 2px 10px rgba(176,141,79,.08);}
  details.review>summary{cursor:pointer;padding:14px 16px;font-family:var(--serif);font-weight:600;font-size:17px;
    color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px;}
  details.review>summary::-webkit-details-marker{display:none;}
  details.review[open]>summary{border-bottom:1px solid #ece3d2;}
  .rev{padding:15px 16px;display:flex;flex-direction:column;gap:12px;background:var(--panel);}
  .rev label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:600;
    display:flex;flex-direction:column;gap:6px;}
  .rev label.chk{flex-direction:row;align-items:center;gap:9px;color:var(--ink);font-size:13px;
    text-transform:none;letter-spacing:0;font-weight:500;}
  .rev label.chk input{accent-color:var(--gold);width:16px;height:16px;}
  .rev select,.rev input[type=text],.rev textarea{font-family:var(--sans);font-size:13.5px;color:var(--ink);
    padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);width:100%;transition:border-color .15s,box-shadow .15s;}
  .rev select:focus,.rev input[type=text]:focus,.rev textarea:focus{outline:none;border-color:var(--gold-soft);box-shadow:0 0 0 3px rgba(201,170,108,.16);}
  .rev textarea{resize:vertical;font-family:var(--sans);}
  .revbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .revbtns button{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:11px 16px;
    border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:all .15s;}
  .revbtns button:hover{border-color:var(--gold-soft);}
  .revbtns .primary{background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:#fff;border-color:var(--accent-deep);
    text-transform:uppercase;letter-spacing:.07em;box-shadow:0 3px 10px rgba(124,15,39,.28);}
  .revbtns .primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .rvmsg{display:none;font-size:12.5px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);padding:10px 12px;border-radius:9px;}
  .rvmsg code{background:#fff;padding:1px 5px;border-radius:5px;border:1px solid var(--line);font-size:12px;}

  /* ---- legend (frosted) ---- */
  .legend,.titlebox{background:rgba(255,253,249,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);border:1px solid rgba(231,224,211,.7);
    font-size:12px;line-height:1.7;color:var(--ink);}
  .legend .lh{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:600;margin-bottom:5px;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;
    box-shadow:0 0 0 2px #fff,0 1px 2px rgba(0,0,0,.2);}

  /* ---- mobile ---- */
  #menuBtn{display:none;}
  @media(max-width:780px){
    #app{grid-template-columns:1fr;}
    header{padding:11px 16px;gap:12px;}
    header .brand .bname{font-size:20px;}
    aside{position:fixed;top:62px;left:0;bottom:0;width:88vw;max-width:360px;z-index:600;
      transform:translateX(-103%);transition:transform .25s cubic-bezier(.22,.61,.36,1);box-shadow:var(--shadow-lg);}
    aside.open{transform:translateX(0);}
    #map{grid-column:1;grid-row:2;}
    .filters{max-height:55%;}
    #menuBtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);
      background:var(--panel);color:var(--gold);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn">☰</button>
    <div class="brand"><span class="bname"><span class="fork">✦</span><span id="ttl">Stockholm Food Map</span></span><small id="sub"></small></div>
    <div class="search"><input id="q" type="search" placeholder="Search name, cuisine, neighborhood, note…" autocomplete="off"></div>
    <div class="count"><b id="shown">0</b>of <span id="tot">0</span> places</div>
    <button id="resetBtn">Reset</button>
  </header>

  <aside id="sidebar">
    <div class="filters">
      <div class="fgroup"><label class="flabel">Type</label><div class="chips" id="f-type"></div></div>
      <div class="fgroup"><label class="flabel">Michelin distinction</label><div class="chips" id="f-michelin"></div></div>
      <div class="fgroup"><label class="flabel">Value tier</label><div class="chips" id="f-value"></div></div>
      <div class="fgroup"><label class="flabel">Confidence</label><div class="chips" id="f-conf"></div></div>
      <div class="fgroup"><label class="flabel">Cuisine</label><div class="row"><select id="f-cuisine"></select></div></div>
      <div class="fgroup"><label class="flabel">Vibe</label><div class="chips" id="f-vibe"></div></div>
      <div class="fgroup"><label class="flabel">Max distance from home</label>
        <div class="row"><input type="range" id="f-dist" min="0" max="10" step="0.5" value="10"><span class="slider-val" id="distval">any</span></div>
      </div>
      <div class="fgroup"><label class="flabel">Sort by</label><div class="row"><select id="f-sort">
        <option value="dist">Distance (near → far)</option>
        <option value="dna">Michelin DNA (high → low)</option>
        <option value="value">Best value first</option>
        <option value="name">Name (A → Z)</option>
        <option value="rank">Recommendation rank</option>
      </select></div></div>
    </div>
    <div class="listhead" id="listhead">Places</div>
    <div class="listwrap" id="list"></div>
  </aside>

  <div id="map"></div>
</div>

<div id="detail">
  <div class="dhead"><button class="dclose" id="dclose">×</button><h2 id="d-name"></h2><div id="d-badges"></div></div>
  <div class="dbody" id="d-body"></div>
</div>

alue_tier":"everyday","lat":59.3128478,"lng":18.0831757,"address":"Skånegatan 79","neighborhood":"Stockholm","distance_km":8.3,"vibe_tags":[],"michelin_dna_score":1,"confidence":"verified","inspector_note":"This lively wine bar is a perfect fit for the neighbourhood. Sit at closely set tables or on high stools either up at the bar counter or next to the window, surrounded by paintings and hunting ...","accepts_reservations":"No","source":["michelin"],"source_url":"https://guide.michelin.com/se/en/stockholm-region/stockholm/restaurant/bar-agrikultur","last_verified":"2026-06-12","notes":""},{"id":"voisine","name":"Voisine","type":"restaurant","cuisine":["Modern Cuisine"],"michelin":"none","green_star":false,"price":"On a budget","value_tier":"everyday","lat":59.3140798,"lng":18.0903578,"address":"Erstagatan 21","neighborhood":"Stockholm","distance_km":8.6,"vibe_tags":[],"michelin_dna_score":0.6,"confidence":"verified","inspector_note":"Homely and cosy, there is a wonderful lack of pretension to this French-inspired bistro. Flavourful dishes from the small open kitchen include classical French desserts like blueberry clafoutis ...","accepts_reservations":"No","source":["michelin"],"source_url":"https://guide.michelin.com/se/en/stockholm-region/stockholm/restaurant/voisine","last_verified":"2026-06-12","notes":""},{"id":"aira","name":"AIRA","type":"restaurant","cuisine":["Modern Cuisine"],"michelin":"two-star","green_star":false,"price":"Spare no expense","value_tier":"splurge","lat":59.3209372,"lng":18.123702,"address":"Biskopsvägen 9","neighborhood":"Stockholm","distance_km":9.8,"vibe_tags":[],"michelin_dna_score":1,"confidence":"verified","inspector_note":"This strikingly designed restaurant sits near the beautiful Royal Djurgården. Its stage is the open kitchen, with the chefs often adding their finishing touches tableside. Beautifully composed ...","accepts_reservations":"No","source":["michelin"],"source_url":"https://guide.michelin.com/se/en/stockholm-region/stockholm/restaurant/aira","last_verified":"2026-06-12","notes":""},{"id":"solen","name":"SOLEN","type":"restaurant","cuisine":["Modern Cuisine"],"michelin":"none","green_star":false,"price":"On a budget","value_tier":"everyday","lat":59.29212,"lng":18.0777,"address":"Hallgränd 45,  Johanneshov","neighborhood":"Stockholm","distance_km":9.8,"vibe_tags":[],"michelin_dna_score":0.6,"confidence":"verified","inspector_note":"If there's such a thing as ‘industrial elegance’, then they’ve found it at this bang on-trend spot in the city’s meat-packing district. Exposed wires and concrete pillars combine with white ...","accepts_reservations":"No","source":["michelin"],"source_url":"https://guide.michelin.com/se/en/stockholm-region/stockholm/restaurant/solen","last_verified":"2026-06-12","notes":""}],"feedback":{"_comment":"Powers the in-map review form. repo = owner/name the GitHub Issue is opened against; the log-visit Action commits it to data/visits.jsonl.","enabled":true,"repo":"TURuibo/stockholm-food-agent"}};</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const D = window.FOOD_DATA || { home:{lat:59.3614,lng:17.9710,name:"Sundbyberg"}, places:[], title:"" };
const PLACES = (D.places||[]).filter(p => p.lat!=null && p.lng!=null);
const HOME = D.home;

// refined palette tuned for the light CARTO Positron basemap
const TIER_COLOR = { "three-star":"#8a0b29","two-star":"#a4123f","one-star":"#c2452f","bib":"#c8851a","none":"#5b7a99" };
const CAFE_COLOR = "#7d5a9e";
const TIER_LABEL = { "three-star":"★★★","two-star":"★★","one-star":"★","bib":"Bib Gourmand","none":"" };
const VALUE_LABEL = { everyday:"💰 everyday", mid:"💰💰 mid", splurge:"💰💰💰 splurge" };
const VALUE_RANK  = { everyday:0, mid:1, splurge:2 };
const TIER_RANK   = { "three-star":4,"two-star":3,"one-star":2,"bib":1,"none":0 };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("ttl").textContent = D.title || "Stockholm Food Map";
document.getElementById("sub").textContent = PLACES.length + " curated places · home: " + (HOME.name||"home");
document.getElementById("tot").textContent = PLACES.length;

/* ---------- map ---------- */
const map = L.map("map",{scrollWheelZoom:true,zoomControl:true});
// CARTO Positron — clean, minimal, premium basemap (retina tiles)
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  maxZoom:20, subdomains:"abcd",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);
// home marker — charcoal disc with a gold ring
L.circleMarker([HOME.lat,HOME.lng],{radius:8,color:"#b08d4f",weight:3,fillColor:"#1f1e1b",fillOpacity:1})
  .addTo(map).bindPopup("<b>✦ "+esc(HOME.name||"home")+"</b><br>home base");
[1,3,5].forEach(km=>L.circle([HOME.lat,HOME.lng],{radius:km*1000,color:"#b08d4f",weight:1,fill:false,dashArray:"3 7",opacity:.45})
  .addTo(map).bindTooltip(km+" km"));
const markerLayer = L.layerGroup().addTo(map);

/* color/size of marker — colored fill with a crisp white halo */
function baseWeight(p){ return p.rank?2.5:2; }
function styleFor(p){
  const star = p.michelin && p.michelin!=="none" && p.michelin!=="bib";
  const fill = p.type==="cafe" ? CAFE_COLOR : (TIER_COLOR[p.michelin] || TIER_COLOR.none);
  return { radius:p.rank?9:(star?7:6), color:"#ffffff", weight:baseWeight(p), fillColor:fill, fillOpacity:1 };
}

/* ---------- build per-place records ---------- */
const REC = PLACES.map((p,i)=>{
  const m = L.circleMarker([p.lat,p.lng], styleFor(p));
  m.on("click",()=>openDetail(i,true));
  m.on("mouseover",()=>hilite(i,true)); m.on("mouseout",()=>hilite(i,false));
  m.bindTooltip(p.name,{direction:"top"});
  return { p, i, marker:m, card:null, visible:true };
});

/* ---------- detail drawer ---------- */
const detail = document.getElementById("detail");
function gmapLink(p){
  const dest = encodeURIComponent((p.address?p.address+", ":"")+(p.name||"")+", Stockholm");
  return "https://www.google.com/maps/dir/?api=1&origin="+HOME.lat+","+HOME.lng+"&destination="+dest;
}
function openDetail(i,fly){
  const {p,marker}=REC[i];
  document.getElementById("d-name").textContent = (p.rank?("#"+p.rank+" "):"")+(p.name||"");
  const color = p.type==="cafe" ? CAFE_COLOR : (TIER_COLOR[p.michelin]||TIER_COLOR.none);
  let badges="";
  if(p.michelin&&p.michelin!=="none") badges+='<span class="badge" style="background:'+color+'">'+esc(TIER_LABEL[p.michelin]||p.michelin)+'</span>';
  if(p.green_star) badges+='<span class="badge" style="background:#3a8a3a">🌿 Green Star</span>';
  badges+='<span class="badge" style="background:'+(p.confidence==="verified"?"#5a5345":"#b08d4f")+'">'+esc(p.confidence||"")+'</span>';
  if(p.type==="cafe") badges+='<span class="badge" style="background:'+CAFE_COLOR+'">café</span>';
  document.getElementById("d-badges").innerHTML=badges;

  const dna = Math.round((p.michelin_dna_score||0)*100);
  let h="";
  if(p.reason) h+='<div class="why">➜ '+esc(p.reason)+'</div>';
  if(p.inspector_note) h+='<div class="note">'+esc(p.inspector_note)+'</div>';
  h+='<dl class="kv">';
  h+='<dt>Cuisine</dt><dd>'+esc((p.cuisine||[]).join(", ")||"—")+'</dd>';
  h+='<dt>Price</dt><dd>'+esc(p.price||"—")+' · '+(VALUE_LABEL[p.value_tier]||p.value_tier||"")+'</dd>';
  h+='<dt>Distance</dt><dd>'+(p.distance_km!=null?p.distance_km+" km from home":"—")+'</dd>';
  h+='<dt>Area</dt><dd>'+esc(p.neighborhood||"—")+'</dd>';
  if(p.address) h+='<dt>Address</dt><dd>'+esc(p.address)+'</dd>';
  if(p.accepts_reservations!=null) h+='<dt>Booking</dt><dd>'+esc(p.accepts_reservations)+'</dd>';
  h+='<dt>Michelin DNA</dt><dd>'+dna+'% <div class="dnabar"><i style="width:'+dna+'%"></i></div></dd>';
  if(p.last_verified) h+='<dt>Verified</dt><dd>'+esc(p.last_verified)+'</dd>';
  if((p.source||[]).length) h+='<dt>Source</dt><dd>'+esc((p.source||[]).join(", "))+'</dd>';
  h+='</dl>';
  if((p.vibe_tags||[]).length) h+='<label class="flabel" style="color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;">Vibe</label><div class="vchips">'+p.vibe_tags.map(v=>'<span>'+esc(v)+'</span>').join("")+'</div>';
  if(p.notes) h+='<div class="note" style="margin-top:16px;font-style:italic;font-size:15px;">“'+esc(p.notes)+'”</div>';
  h+='<div class="dlinks">';
  if(p.source_url) h+='<a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">↗ Source / Michelin page</a>';
  h+='<a href="'+gmapLink(p)+'" target="_blank" rel="noopener">🧭 Directions from home</a>';
  h+='<a href="https://www.google.com/search?q='+encodeURIComponent((p.name||"")+" Stockholm")+'" target="_blank" rel="noopener">🔎 Search the web</a>';
  h+='</div>';
  h+=reviewFormHTML(p);
  document.getElementById("d-body").innerHTML=h;
  document.getElementById("d-body").scrollTop=0;
  wireReviewForm(p);
  detail.classList.add("open");
  setActive(i);
  if(fly!==false){ map.setView([p.lat,p.lng], Math.max(map.getZoom(),14),{animate:true}); }
  marker.openPopup&&null;
}

/* ---------- review form (writes back to the project DB via a GitHub Issue) ---------- */
const FB = D.feedback || null;
const signed = n => (n>0?"+":"")+n;
function reviewFormHTML(p){
  return '<details class="review" open><summary>✍️ I visited — leave a review</summary><div class="rev">'
   +'<label>Rating<select id="rv-rating">'
     +'<option value="2">+2 · loved it</option><option value="1">+1 · liked it</option>'
     +'<option value="0" selected>0 · neutral</option><option value="-1">−1 · meh</option>'
     +'<option value="-2">−2 · disliked</option></select></label>'
   +'<label>Occasion<input type="text" id="rv-occasion" placeholder="date / lunch / solo / friends / work"></label>'
   +'<label>With<input type="text" id="rv-with" placeholder="optional — e.g. partner, colleagues"></label>'
   +'<label class="chk"><input type="checkbox" id="rv-return" checked> Would go back</label>'
   +'<label>Comment<textarea id="rv-comment" rows="3" placeholder="What stood out — food, vibe, value, service, what to order?"></textarea></label>'
   +'<div class="revbtns">'
     +'<button class="primary" id="rv-submit">'+(FB&&FB.repo&&FB.enabled!==false?'Submit review →':'Copy review')+'</button>'
     +'<button id="rv-copy">Copy as /visited</button>'
   +'</div><div class="rvmsg" id="rv-msg"></div></div></details>';
}
function rvData(p){
  return {
    id:p.id, name:p.name,
    rating:parseInt(document.getElementById("rv-rating").value,10),
    occasion:document.getElementById("rv-occasion").value.trim(),
    companions:document.getElementById("rv-with").value.trim(),
    would_return:document.getElementById("rv-return").checked,
    comment:document.getElementById("rv-comment").value.trim()
  };
}
function rvMsg(html){ const m=document.getElementById("rv-msg"); if(m){ m.innerHTML=html; m.style.display="block"; } }
function wireReviewForm(p){
  const sub=document.getElementById("rv-submit"); if(sub) sub.onclick=()=>submitReview(p);
  const cp=document.getElementById("rv-copy"); if(cp) cp.onclick=()=>copyVisitedCmd(p);
}
function submitReview(p){
  const d=rvData(p);
  if(!(FB&&FB.repo&&FB.enabled!==false)){ copyVisitedCmd(p); return; }
  const body="Submitted from the Stockholm Food Map. The **log-visit** Action appends this to `data/visits.jsonl`, commits, and closes this issue.\n\n```json\n"
    +JSON.stringify(d,null,2)+"\n```\n";
  const url="https://github.com/"+FB.repo+"/issues/new?labels=visit"
    +"&title="+encodeURIComponent("🍽️ visit: "+p.name+" ("+signed(d.rating)+")")
    +"&body="+encodeURIComponent(body);
  window.open(url,"_blank","noopener");
  rvMsg('Opened a prefilled GitHub issue — click <b>Submit new issue</b> there. It commits your review to the repo; run <code>git pull</code> at home to sync. Taste updates after a few reviews.');
}
function copyVisitedCmd(p){
  const d=rvData(p);
  const cmt=(d.comment||"").replace(/"/g,"'")+(d.occasion?" ["+d.occasion+"]":"")+(d.would_return?"":" [would not return]");
  const cmd='/visited '+p.id+' '+signed(d.rating)+' "'+cmt.trim()+'"';
  if(navigator.clipboard) navigator.clipboard.writeText(cmd);
  rvMsg('Copied — paste to Claude:<br><code>'+esc(cmd)+'</code>');
}
document.getElementById("dclose").onclick=()=>{detail.classList.remove("open");setActive(null);};

/* ---------- list ---------- */
const listEl=document.getElementById("list");
function cardHTML(p){
  const color=p.type==="cafe"?CAFE_COLOR:(TIER_COLOR[p.michelin]||TIER_COLOR.none);
  const tier=(p.michelin&&p.michelin!=="none")?'<span class="badge" style="background:'+color+'">'+esc(TIER_LABEL[p.michelin])+'</span>':"";
  return '<div class="ctop"><div class="cname">'+(p.rank?'<span class="crank">'+p.rank+'</span>':'')+esc(p.name)+'</div>'
    +'<div class="cdist">'+(p.distance_km!=null?p.distance_km+" km":"")+'</div></div>'
    +'<div class="cmeta">'+tier+esc((p.cuisine||[]).join(", "))+'</div>'
    +'<div class="cmeta">'+(VALUE_LABEL[p.value_tier]||"")+' · '+esc(p.neighborhood||"")+'</div>';
}
REC.forEach(r=>{
  const c=document.createElement("div"); c.className="card"; c.innerHTML=cardHTML(r.p);
  c.onclick=()=>openDetail(r.i,true);
  c.onmouseenter=()=>hilite(r.i,true); c.onmouseleave=()=>hilite(r.i,false);
  r.card=c;
});
function setActive(i){ REC.forEach(r=>r.card.classList.toggle("active", r.i===i)); }
function hilite(i,on){
  const r=REC[i]; if(!r) return;
  r.card.classList.toggle("hot",on);
  r.marker.setStyle({weight:on?4:baseWeight(r.p),radius:on?(r.p.rank?10:8):styleFor(r.p).radius});
  if(on) r.marker.bringToFront&&r.marker.bringToFront();
}

/* ---------- filters state ---------- */
const F = { type:new Set(), michelin:new Set(), value:new Set(), conf:new Set(), vibe:new Set(), cuisine:"", dist:10, q:"", sort:"dist" };
function uniq(arr){return [...new Set(arr)];}

function chipset(elId, values, key, labelFn){
  const el=document.getElementById(elId);
  values.forEach(v=>{
    const b=document.createElement("button"); b.className="chip"+(key==="vibe"?" vibe":""); b.textContent=labelFn?labelFn(v):v;
    b.setAttribute("aria-pressed","false");
    b.onclick=()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",String(!on));
      if(!on) F[key].add(v); else F[key].delete(v); apply(); };
    el.appendChild(b);
  });
}
chipset("f-type", uniq(PLACES.map(p=>p.type)), "type");
chipset("f-michelin", ["three-star","two-star","one-star","bib","none"].filter(t=>PLACES.some(p=>p.michelin===t)), "michelin", t=>TIER_LABEL[t]||t==="none"&&"Unrated"||t);
chipset("f-value", ["everyday","mid","splurge"].filter(v=>PLACES.some(p=>p.value_tier===v)), "value", v=>VALUE_LABEL[v]||v);
chipset("f-conf", uniq(PLACES.map(p=>p.confidence)), "conf");
chipset("f-vibe", uniq(PLACES.flatMap(p=>p.vibe_tags||[])).sort(), "vibe");

const cuiSel=document.getElementById("f-cuisine");
cuiSel.innerHTML='<option value="">All cuisines</option>'+uniq(PLACES.flatMap(p=>p.cuisine||[])).sort().map(c=>'<option>'+esc(c)+'</option>').join("");
cuiSel.onchange=()=>{F.cuisine=cuiSel.value;apply();};

const maxDist=Math.ceil(Math.max(...PLACES.map(p=>p.distance_km||0),1));
const distEl=document.getElementById("f-dist"); distEl.max=maxDist; distEl.value=maxDist; F.dist=maxDist;
const distVal=document.getElementById("distval"); distVal.textContent="any";
distEl.oninput=()=>{F.dist=+distEl.value; distVal.textContent=(F.dist>=maxDist)?"any":("≤ "+F.dist+" km"); apply();};

document.getElementById("q").oninput=e=>{F.q=e.target.value.toLowerCase().trim();apply();};
document.getElementById("f-sort").onchange=e=>{F.sort=e.target.value;apply();};

document.getElementById("resetBtn").onclick=()=>{
  ["type","michelin","value","conf","vibe"].forEach(k=>F[k].clear());
  F.cuisine="";F.dist=maxDist;F.q="";F.sort="dist";
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  cuiSel.value="";distEl.value=maxDist;distVal.textContent="any";
  document.getElementById("q").value="";document.getElementById("f-sort").value="dist";
  apply();
};

/* ---------- apply filters + sort ---------- */
function matches(p){
  if(F.type.size&&!F.type.has(p.type)) return false;
  if(F.michelin.size&&!F.michelin.has(p.michelin)) return false;
  if(F.value.size&&!F.value.has(p.value_tier)) return false;
  if(F.conf.size&&!F.conf.has(p.confidence)) return false;
  if(F.vibe.size&&![...F.vibe].every(v=>(p.vibe_tags||[]).includes(v))) return false;
  if(F.cuisine&&!(p.cuisine||[]).includes(F.cuisine)) return false;
  if((p.distance_km||0)>F.dist) return false;
  if(F.q){
    const hay=[p.name,(p.cuisine||[]).join(" "),p.neighborhood,p.inspector_note,(p.vibe_tags||[]).join(" "),p.address].join(" ").toLowerCase();
    if(!hay.includes(F.q)) return false;
  }
  return true;
}
function sortFn(a,b){
  switch(F.sort){
    case "dna": return (b.p.michelin_dna_score||0)-(a.p.michelin_dna_score||0);
    case "value": return (VALUE_RANK[a.p.value_tier]||0)-(VALUE_RANK[b.p.value_tier]||0) || (a.p.distance_km||0)-(b.p.distance_km||0);
    case "name": return (a.p.name||"").localeCompare(b.p.name||"");
    case "rank": return (a.p.rank||1e9)-(b.p.rank||1e9) || (a.p.distance_km||0)-(b.p.distance_km||0);
    default: return (a.p.distance_km||0)-(b.p.distance_km||0);
  }
}
function apply(){
  const vis=REC.filter(r=>matches(r.p)); vis.sort(sortFn);
  // markers
  markerLayer.clearLayers();
  const bounds=[[HOME.lat,HOME.lng]];
  vis.forEach(r=>{markerLayer.addLayer(r.marker); bounds.push([r.p.lat,r.p.lng]);});
  // list (in sorted order)
  listEl.innerHTML="";
  vis.forEach(r=>listEl.appendChild(r.card));
  document.getElementById("shown").textContent=vis.length;
  document.getElementById("listhead").textContent=vis.length+" places — sorted by "+document.getElementById("f-sort").selectedOptions[0].text.toLowerCase();
  if(vis.length && bounds.length>1) map.fitBounds(bounds,{padding:[50,50],maxZoom:14});
}

/* ---------- legend + mobile menu ---------- */
const legend=L.control({position:"bottomright"});
legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");
  d.innerHTML='<div class="lh">Legend</div>'+
  '<span class="dot" style="background:'+TIER_COLOR["one-star"]+'"></span>Michelin Star<br>'+
  '<span class="dot" style="background:'+TIER_COLOR.bib+'"></span>Bib Gourmand (value)<br>'+
  '<span class="dot" style="background:'+TIER_COLOR.none+'"></span>Unrated (often best value)<br>'+
  '<span class="dot" style="background:'+CAFE_COLOR+'"></span>Café';
  L.DomEvent.disableClickPropagation(d); return d;};
legend.addTo(map);

const sidebar=document.getElementById("sidebar");
document.getElementById("menuBtn").onclick=()=>sidebar.classList.toggle("open");

/* initial sort: if any place has a rank (shortlist), default to rank view */
if(PLACES.some(p=>p.rank)){ F.sort="rank"; document.getElementById("f-sort").value="rank"; }
apply();
</script>

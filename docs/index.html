<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockholm Food Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#f7f6f3; --panel:#fff; --ink:#1c1b1a; --muted:#6b6760; --line:#e7e3dc;
    --accent:#b8002e; --green:#0a7d34; --shadow:0 1px 4px rgba(0,0,0,.18);
    --sidebar-w:340px; --detail-w:380px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);}
  #app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:auto 1fr;height:100%;}

  /* top bar */
  header{grid-column:1 / -1;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:500;}
  header .brand{font-weight:700;font-size:16px;white-space:nowrap;}
  header .brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
  header .search{flex:1;max-width:420px;position:relative;}
  header .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fbfaf8;}
  header .search::before{content:"🔍";position:absolute;left:10px;top:7px;font-size:13px;opacity:.6;}
  header .count{font-size:12px;color:var(--muted);white-space:nowrap;}
  header .count b{color:var(--ink);font-size:14px;}
  #resetBtn{border:1px solid var(--line);background:#fbfaf8;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;}
  #resetBtn:hover{background:#f0ede8;}

  /* sidebar */
  aside{grid-row:2;grid-column:1;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0;}
  .filters{padding:12px 14px;border-bottom:1px solid var(--line);overflow-y:auto;max-height:46%;}
  .filters .fgroup{margin-bottom:12px;}
  .filters label.flabel{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{font-size:12px;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:#fbfaf8;cursor:pointer;user-select:none;line-height:1.3;}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.vibe[aria-pressed="true"]{background:#6b3fa0;border-color:#6b3fa0;}
  .row{display:flex;gap:8px;align-items:center;}
  .row select{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fbfaf8;}
  .slider-val{font-size:12px;color:var(--muted);min-width:54px;text-align:right;}
  input[type=range]{width:100%;}

  /* list */
  .listwrap{flex:1;overflow-y:auto;min-height:0;}
  .listhead{padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:2;}
  .card{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .card:hover,.card.hot{background:#f3efe8;}
  .card.active{background:#fdf1e7;box-shadow:inset 3px 0 0 var(--accent);}
  .card .ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .card .cname{font-weight:600;font-size:14px;}
  .card .cdist{font-size:11px;color:var(--muted);white-space:nowrap;}
  .card .cmeta{font-size:12px;color:var(--muted);margin-top:2px;}
  .card .crank{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;margin-right:5px;}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;color:#fff;margin-right:4px;vertical-align:middle;}

  /* map */
  #map{grid-row:2;grid-column:2;height:100%;min-height:0;}
  .leaflet-popup-content{margin:9px 12px;}
  .pop b{font-size:13px;}

  /* detail drawer */
  #detail{position:fixed;top:0;right:0;height:100%;width:var(--detail-w);max-width:92vw;background:var(--panel);box-shadow:-2px 0 16px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .22s ease;z-index:1000;display:flex;flex-direction:column;}
  #detail.open{transform:translateX(0);}
  #detail .dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative;}
  #detail .dclose{position:absolute;top:12px;right:14px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
  #detail h2{margin:0 26px 6px 0;font-size:19px;}
  #detail .dbody{padding:14px 18px;overflow-y:auto;flex:1;}
  #detail .why{background:#eaf7ee;border-left:3px solid var(--green);color:#0a5c28;padding:8px 11px;border-radius:6px;font-size:13px;margin-bottom:14px;}
  #detail .why-listed{background:#fbf3e6;border-left-color:#c08a1e;color:#6b4a05;}
  #detail .note{font-size:13.5px;line-height:1.55;color:#33302b;margin-bottom:16px;}
  ul.goodparts{margin:4px 0 16px;padding-left:18px;font-size:13.5px;line-height:1.5;color:#33302b;}
  ul.goodparts li{margin-bottom:3px;}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px;}
  .kv dt{color:var(--muted);}
  .kv dd{margin:0;}
  .dnabar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px;}
  .dnabar > i{display:block;height:100%;background:linear-gradient(90deg,#2f7fd6,#b8002e);}
  .dlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .dlinks a{font-size:12.5px;text-decoration:none;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fbfaf8;color:var(--ink);}
  .dlinks a:hover{background:#f0ede8;}
  .vchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .vchips span{font-size:11.5px;background:#efe9f6;color:#5a2d91;padding:2px 8px;border-radius:11px;}

  /* review form */
  details.review{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:#fbfaf8;}
  details.review>summary{cursor:pointer;padding:11px 13px;font-weight:600;font-size:13.5px;list-style:none;}
  details.review>summary::-webkit-details-marker{display:none;}
  details.review[open]>summary{border-bottom:1px solid var(--line);}
  .rev{padding:12px 13px;display:flex;flex-direction:column;gap:10px;}
  .rev label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
  .rev label.chk{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:13px;}
  .rev select,.rev input[type=text],.rev textarea{font:inherit;font-size:13.5px;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;}
  .rev textarea{resize:vertical;}
  .revbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .revbtns button{font:inherit;font-size:13px;padding:8px 13px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff;}
  .revbtns .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .revbtns .primary:hover{background:#9c0026;}
  .rvmsg{display:none;font-size:12.5px;line-height:1.5;background:#eef4fb;border:1px solid #cfe0f2;color:#234;padding:8px 10px;border-radius:7px;}
  .rvmsg code{background:#fff;padding:1px 4px;border-radius:4px;}

  /* legend */
  .legend{background:rgba(255,255,255,.95);padding:8px 11px;border-radius:8px;box-shadow:var(--shadow);font-size:12px;line-height:1.6;}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* mobile */
  #menuBtn{display:none;}
  @media(max-width:760px){
    #app{grid-template-columns:1fr;}
    aside{position:fixed;top:53px;left:0;bottom:0;width:86vw;max-width:360px;z-index:600;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);}
    aside.open{transform:translateX(0);}
    #map{grid-column:1;grid-row:2;}
    .filters{max-height:55%;}
    #menuBtn{display:inline-block;border:1px solid var(--line);background:#fbfaf8;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn">☰</button>
    <div class="brand">🍽️ <span id="ttl">Stockholm Food Map</span><small id="sub"></small></div>
    <div class="search"><input id="q" type="search" placeholder="Search name, cuisine, neighborhood, note…" autocomplete="off"></div>
    <div class="count"><b id="shown">0</b>/<span id="tot">0</span> places</div>
    <button id="resetBtn">Reset</button>
  </header>

  <aside id="sidebar">
    <div class="filters">
      <div class="fgroup"><label class="flabel">Type</label><div class="chips" id="f-type"></div></div>
      <div class="fgroup"><label class="flabel">Michelin distinction</label><div class="chips" id="f-michelin"></div></div>
      <div class="fgroup"><label class="flabel">Value tier</label><div class="chips" id="f-value"></div></div>
      <div class="fgroup"><label class="flabel">Confidence</label><div class="chips" id="f-conf"></div></div>
      <div class="fgroup"><label class="flabel">Cuisine</label><div class="row"><select id="f-cuisine"></select></div></div>
      <div class="fgroup"><label class="flabel">Vibe</label><div class="chips" id="f-vibe"></div></div>
      <div class="fgroup"><label class="flabel">Max distance from home</label>
        <div class="row"><input type="range" id="f-dist" min="0" max="10" step="0.5" value="10"><span class="slider-val" id="distval">any</span></div>
      </div>
      <div class="fgroup"><label class="flabel">Sort by</label><div class="row"><select id="f-sort">
        <option value="dist">Distance (near → far)</option>
        <option value="dna">Michelin DNA (high → low)</option>
        <option value="value">Best value first</option>
        <option value="name">Name (A → Z)</option>
        <option value="rank">Recommendation rank</option>
      </select></div></div>
    </div>
    <div class="listhead" id="listhead">Places</div>
    <div class="listwrap" id="list"></div>
  </aside>

  <div id="map"></div>
</div>

<div id="detail">
  <div class="dhead"><button class="dclose" id="dclose">×</button><h2 id="d-name"></h2><div id="d-badges"></div></div>
  <div class="dbody" id="d-body"></div>
</div>

:"splurge","lat":59.3209372,"lng":18.123702,"address":"Biskopsvägen 9","neighborhood":"Stockholm","distance_km":9.8,"vibe_tags":[],"michelin_dna_score":1,"confidence":"verified","inspector_note":"This strikingly designed restaurant sits near the beautiful Royal Djurgården. Its stage is the open kitchen, with the chefs often adding their finishing touches tableside. Beautifully composed ...","why_listed":"Michelin 2-star — a top-end reference for the taste fingerprint. Aspirational, down-weighted for everyday picks because of the price.","highlights":["Beautifully composed two-star cooking","Striking design near Djurgården","Tableside finishing from the open kitchen"],"accepts_reservations":"No","added_via":"Imported from the Michelin Guide Stockholm selection by the scraper (scripts/michelin_scrape.mjs, via /refresh-michelin).","source":["michelin"],"source_url":"https://guide.michelin.com/se/en/stockholm-region/stockholm/restaurant/aira","last_verified":"2026-06-12","notes":""},{"id":"solen","name":"SOLEN","type":"restaurant","cuisine":["Modern Cuisine"],"michelin":"none","green_star":false,"price":"On a budget","value_tier":"everyday","lat":59.29212,"lng":18.0777,"address":"Hallgränd 45,  Johanneshov","neighborhood":"Stockholm","distance_km":9.8,"vibe_tags":[],"michelin_dna_score":0.6,"confidence":"verified","inspector_note":"If there's such a thing as ‘industrial elegance’, then they’ve found it at this bang on-trend spot in the city’s meat-packing district. Exposed wires and concrete pillars combine with white ...","why_listed":"On the Michelin Guide's Stockholm selection (listed, not starred) — inspector-vetted cooking without the star-level price. Right in the value sweet spot.","highlights":["'Industrial elegance' in the old meat-packing district","On-trend modern cooking","Budget-priced for a Michelin listing"],"accepts_reservations":"No","added_via":"Imported from the Michelin Guide Stockholm selection by the scraper (scripts/michelin_scrape.mjs, via /refre <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const D = window.FOOD_DATA || { home:{lat:59.3614,lng:17.9710,name:"Sundbyberg"}, places:[], title:"" };
const PLACES = (D.places||[]).filter(p => p.lat!=null && p.lng!=null);
const HOME = D.home;

const TIER_COLOR = { "three-star":"#7a0017","two-star":"#9e0023","one-star":"#d4341f","bib":"#e07b00","none":"#2f7fd6" };
const TIER_LABEL = { "three-star":"★★★","two-star":"★★","one-star":"★","bib":"Bib Gourmand","none":"" };
const VALUE_LABEL = { everyday:"💰 everyday", mid:"💰💰 mid", splurge:"💰💰💰 splurge" };
const VALUE_RANK  = { everyday:0, mid:1, splurge:2 };
const TIER_RANK   = { "three-star":4,"two-star":3,"one-star":2,"bib":1,"none":0 };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("ttl").textContent = D.title || "Stockholm Food Map";
document.getElementById("sub").textContent = PLACES.length + " places · home: " + (HOME.name||"home");
document.getElementById("tot").textContent = PLACES.length;

/* ---------- map ---------- */
const map = L.map("map",{scrollWheelZoom:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
L.circleMarker([HOME.lat,HOME.lng],{radius:9,color:"#111",weight:2,fillColor:"#111",fillOpacity:1})
  .addTo(map).bindPopup("<b>🏠 "+esc(HOME.name||"home")+"</b><br>home base");
[1,3,5].forEach(km=>L.circle([HOME.lat,HOME.lng],{radius:km*1000,color:"#999",weight:1,fill:false,dashArray:"4 6"})
  .addTo(map).bindTooltip(km+" km"));
const markerLayer = L.layerGroup().addTo(map);

/* color/size of marker */
function styleFor(p){
  const color = TIER_COLOR[p.michelin] || "#2f7fd6";
  return { radius:p.rank?10:6, color:p.type==="cafe"?"#6b3fa0":color, weight:p.rank?3:1.5, fillColor:color, fillOpacity:.85 };
}

/* ---------- build per-place records ---------- */
const REC = PLACES.map((p,i)=>{
  const m = L.circleMarker([p.lat,p.lng], styleFor(p));
  m.on("click",()=>openDetail(i,true));
  m.on("mouseover",()=>hilite(i,true)); m.on("mouseout",()=>hilite(i,false));
  m.bindTooltip(p.name,{direction:"top"});
  return { p, i, marker:m, card:null, visible:true };
});

/* ---------- detail drawer ---------- */
const detail = document.getElementById("detail");
function gmapLink(p){
  const dest = encodeURIComponent((p.address?p.address+", ":"")+(p.name||"")+", Stockholm");
  return "https://www.google.com/maps/dir/?api=1&origin="+HOME.lat+","+HOME.lng+"&destination="+dest;
}
function openDetail(i,fly){
  const {p,marker}=REC[i];
  document.getElementById("d-name").textContent = (p.rank?("#"+p.rank+" "):"")+(p.name||"");
  const color = TIER_COLOR[p.michelin]||"#2f7fd6";
  let badges="";
  if(p.michelin&&p.michelin!=="none") badges+='<span class="badge" style="background:'+color+'">'+esc(TIER_LABEL[p.michelin]||p.michelin)+'</span>';
  if(p.green_star) badges+='<span class="badge" style="background:#3a8a3a">🌿 Green Star</span>';
  badges+='<span class="badge" style="background:'+(p.confidence==="verified"?"#444":"#b58900")+'">'+esc(p.confidence||"")+'</span>';
  if(p.type==="cafe") badges+='<span class="badge" style="background:#6b3fa0">café</span>';
  document.getElementById("d-badges").innerHTML=badges;

  const dna = Math.round((p.michelin_dna_score||0)*100);
  let h="";
  if(p.reason) h+='<div class="why">➜ '+esc(p.reason)+'</div>';
  if(p.why_listed) h+='<div class="why why-listed"><b>Why it’s on your list:</b> '+esc(p.why_listed)+'</div>';
  if((p.highlights||[]).length){
    h+='<label class="flabel">The good parts</label><ul class="goodparts">'
      +p.highlights.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  }
  if(p.inspector_note) h+='<div class="note">'+esc(p.inspector_note)+'</div>';
  h+='<dl class="kv">';
  h+='<dt>Cuisine</dt><dd>'+esc((p.cuisine||[]).join(", ")||"—")+'</dd>';
  h+='<dt>Price</dt><dd>'+esc(p.price||"—")+' · '+(VALUE_LABEL[p.value_tier]||p.value_tier||"")+'</dd>';
  h+='<dt>Distance</dt><dd>'+(p.distance_km!=null?p.distance_km+" km from home":"—")+'</dd>';
  h+='<dt>Area</dt><dd>'+esc(p.neighborhood||"—")+'</dd>';
  if(p.address) h+='<dt>Address</dt><dd>'+esc(p.address)+'</dd>';
  if(p.accepts_reservations!=null) h+='<dt>Booking</dt><dd>'+esc(p.accepts_reservations)+'</dd>';
  h+='<dt>Michelin DNA</dt><dd>'+dna+'% <div class="dnabar"><i style="width:'+dna+'%"></i></div></dd>';
  if(p.last_verified) h+='<dt>Verified</dt><dd>'+esc(p.last_verified)+'</dd>';
  if((p.source||[]).length) h+='<dt>Source</dt><dd>'+esc((p.source||[]).join(", "))+'</dd>';
  if(p.added_via) h+='<dt>How added</dt><dd>'+esc(p.added_via)+'</dd>';
  h+='</dl>';
  if((p.vibe_tags||[]).length) h+='<label class="flabel">Vibe</label><div class="vchips">'+p.vibe_tags.map(v=>'<span>'+esc(v)+'</span>').join("")+'</div>';
  if(p.notes) h+='<div class="note" style="margin-top:14px;font-style:italic">📝 '+esc(p.notes)+'</div>';
  h+='<div class="dlinks">';
  if(p.source_url) h+='<a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">↗ Source / Michelin page</a>';
  h+='<a href="'+gmapLink(p)+'" target="_blank" rel="noopener">🧭 Directions from home</a>';
  h+='<a href="https://www.google.com/search?q='+encodeURIComponent((p.name||"")+" Stockholm")+'" target="_blank" rel="noopener">🔎 Search the web</a>';
  h+='</div>';
  h+=reviewFormHTML(p);
  document.getElementById("d-body").innerHTML=h;
  wireReviewForm(p);
  detail.classList.add("open");
  setActive(i);
  if(fly!==false){ map.setView([p.lat,p.lng], Math.max(map.getZoom(),14),{animate:true}); }
  marker.openPopup&&null;
}

/* ---------- review form (writes back to the project DB via a GitHub Issue) ---------- */
const FB = D.feedback || null;
const signed = n => (n>0?"+":"")+n;
function reviewFormHTML(p){
  return '<details class="review" open><summary>✍️ I visited — leave a review</summary><div class="rev">'
   +'<label>Rating<select id="rv-rating">'
     +'<option value="2">+2 · loved it</option><option value="1">+1 · liked it</option>'
     +'<option value="0" selected>0 · neutral</option><option value="-1">−1 · meh</option>'
     +'<option value="-2">−2 · disliked</option></select></label>'
   +'<label>Occasion<input type="text" id="rv-occasion" placeholder="date / lunch / solo / friends / work"></label>'
   +'<label>With<input type="text" id="rv-with" placeholder="optional — e.g. partner, colleagues"></label>'
   +'<label class="chk"><input type="checkbox" id="rv-return" checked> Would go back</label>'
   +'<label>Comment<textarea id="rv-comment" rows="3" placeholder="What stood out — food, vibe, value, service, what to order?"></textarea></label>'
   +'<div class="revbtns">'
     +'<button class="primary" id="rv-submit">'+(FB&&FB.repo&&FB.enabled!==false?'Submit review →':'Copy review')+'</button>'
     +'<button id="rv-copy">Copy as /visited</button>'
   +'</div><div class="rvmsg" id="rv-msg"></div></div></details>';
}
function rvData(p){
  return {
    id:p.id, name:p.name,
    rating:parseInt(document.getElementById("rv-rating").value,10),
    occasion:document.getElementById("rv-occasion").value.trim(),
    companions:document.getElementById("rv-with").value.trim(),
    would_return:document.getElementById("rv-return").checked,
    comment:document.getElementById("rv-comment").value.trim()
  };
}
function rvMsg(html){ const m=document.getElementById("rv-msg"); if(m){ m.innerHTML=html; m.style.display="block"; } }
function wireReviewForm(p){
  const sub=document.getElementById("rv-submit"); if(sub) sub.onclick=()=>submitReview(p);
  const cp=document.getElementById("rv-copy"); if(cp) cp.onclick=()=>copyVisitedCmd(p);
}
function submitReview(p){
  const d=rvData(p);
  if(!(FB&&FB.repo&&FB.enabled!==false)){ copyVisitedCmd(p); return; }
  const body="Submitted from the Stockholm Food Map. The **log-visit** Action appends this to `data/visits.jsonl`, commits, and closes this issue.\n\n```json\n"
    +JSON.stringify(d,null,2)+"\n```\n";
  const url="https://github.com/"+FB.repo+"/issues/new?labels=visit"
    +"&title="+encodeURIComponent("🍽️ visit: "+p.name+" ("+signed(d.rating)+")")
    +"&body="+encodeURIComponent(body);
  window.open(url,"_blank","noopener");
  rvMsg('Opened a prefilled GitHub issue — click <b>Submit new issue</b> there. It commits your review to the repo; run <code>git pull</code> at home to sync. Taste updates after a few reviews.');
}
function copyVisitedCmd(p){
  const d=rvData(p);
  const cmt=(d.comment||"").replace(/"/g,"'")+(d.occasion?" ["+d.occasion+"]":"")+(d.would_return?"":" [would not return]");
  const cmd='/visited '+p.id+' '+signed(d.rating)+' "'+cmt.trim()+'"';
  if(navigator.clipboard) navigator.clipboard.writeText(cmd);
  rvMsg('Copied — paste to Claude:<br><code>'+esc(cmd)+'</code>');
}
document.getElementById("dclose").onclick=()=>{detail.classList.remove("open");setActive(null);};

/* ---------- list ---------- */
const listEl=document.getElementById("list");
function cardHTML(p){
  const color=TIER_COLOR[p.michelin]||"#2f7fd6";
  const tier=(p.michelin&&p.michelin!=="none")?'<span class="badge" style="background:'+color+'">'+esc(TIER_LABEL[p.michelin])+'</span>':"";
  return '<div class="ctop"><div class="cname">'+(p.rank?'<span class="crank">'+p.rank+'</span>':'')+esc(p.name)+'</div>'
    +'<div class="cdist">'+(p.distance_km!=null?p.distance_km+" km":"")+'</div></div>'
    +'<div class="cmeta">'+tier+esc((p.cuisine||[]).join(", "))+'</div>'
    +'<div class="cmeta">'+(VALUE_LABEL[p.value_tier]||"")+' · '+esc(p.neighborhood||"")+'</div>';
}
REC.forEach(r=>{
  const c=document.createElement("div"); c.className="card"; c.innerHTML=cardHTML(r.p);
  c.onclick=()=>openDetail(r.i,true);
  c.onmouseenter=()=>hilite(r.i,true); c.onmouseleave=()=>hilite(r.i,false);
  r.card=c;
});
function setActive(i){ REC.forEach(r=>r.card.classList.toggle("active", r.i===i)); }
function hilite(i,on){
  const r=REC[i]; if(!r) return;
  r.card.classList.toggle("hot",on);
  r.marker.setStyle({weight:on?4:(r.p.rank?3:1.5)});
  if(on) r.marker.bringToFront&&r.marker.bringToFront();
}

/* ---------- filters state ---------- */
const F = { type:new Set(), michelin:new Set(), value:new Set(), conf:new Set(), vibe:new Set(), cuisine:"", dist:10, q:"", sort:"dist" };
function uniq(arr){return [...new Set(arr)];}

function chipset(elId, values, key, labelFn){
  const el=document.getElementById(elId);
  values.forEach(v=>{
    const b=document.createElement("button"); b.className="chip"+(key==="vibe"?" vibe":""); b.textContent=labelFn?labelFn(v):v;
    b.setAttribute("aria-pressed","false");
    b.onclick=()=>{ const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",String(!on));
      if(!on) F[key].add(v); else F[key].delete(v); apply(); };
    el.appendChild(b);
  });
}
chipset("f-type", uniq(PLACES.map(p=>p.type)), "type");
chipset("f-michelin", ["three-star","two-star","one-star","bib","none"].filter(t=>PLACES.some(p=>p.michelin===t)), "michelin", t=>TIER_LABEL[t]||t==="none"&&"Unrated"||t);
chipset("f-value", ["everyday","mid","splurge"].filter(v=>PLACES.some(p=>p.value_tier===v)), "value", v=>VALUE_LABEL[v]||v);
chipset("f-conf", uniq(PLACES.map(p=>p.confidence)), "conf");
chipset("f-vibe", uniq(PLACES.flatMap(p=>p.vibe_tags||[])).sort(), "vibe");

const cuiSel=document.getElementById("f-cuisine");
cuiSel.innerHTML='<option value="">All cuisines</option>'+uniq(PLACES.flatMap(p=>p.cuisine||[])).sort().map(c=>'<option>'+esc(c)+'</option>').join("");
cuiSel.onchange=()=>{F.cuisine=cuiSel.value;apply();};

const maxDist=Math.ceil(Math.max(...PLACES.map(p=>p.distance_km||0),1));
const distEl=document.getElementById("f-dist"); distEl.max=maxDist; distEl.value=maxDist; F.dist=maxDist;
const distVal=document.getElementById("distval"); distVal.textContent="any";
distEl.oninput=()=>{F.dist=+distEl.value; distVal.textContent=(F.dist>=maxDist)?"any":("≤ "+F.dist+" km"); apply();};

document.getElementById("q").oninput=e=>{F.q=e.target.value.toLowerCase().trim();apply();};
document.getElementById("f-sort").onchange=e=>{F.sort=e.target.value;apply();};

document.getElementById("resetBtn").onclick=()=>{
  ["type","michelin","value","conf","vibe"].forEach(k=>F[k].clear());
  F.cuisine="";F.dist=maxDist;F.q="";F.sort="dist";
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  cuiSel.value="";distEl.value=maxDist;distVal.textContent="any";
  document.getElementById("q").value="";document.getElementById("f-sort").value="dist";
  apply();
};

/* ---------- apply filters + sort ---------- */
function matches(p){
  if(F.type.size&&!F.type.has(p.type)) return false;
  if(F.michelin.size&&!F.michelin.has(p.michelin)) return false;
  if(F.value.size&&!F.value.has(p.value_tier)) return false;
  if(F.conf.size&&!F.conf.has(p.confidence)) return false;
  if(F.vibe.size&&![...F.vibe].every(v=>(p.vibe_tags||[]).includes(v))) return false;
  if(F.cuisine&&!(p.cuisine||[]).includes(F.cuisine)) return false;
  if((p.distance_km||0)>F.dist) return false;
  if(F.q){
    const hay=[p.name,(p.cuisine||[]).join(" "),p.neighborhood,p.inspector_note,(p.highlights||[]).join(" "),p.why_listed,(p.vibe_tags||[]).join(" "),p.address].join(" ").toLowerCase();
    if(!hay.includes(F.q)) return false;
  }
  return true;
}
function sortFn(a,b){
  switch(F.sort){
    case "dna": return (b.p.michelin_dna_score||0)-(a.p.michelin_dna_score||0);
    case "value": return (VALUE_RANK[a.p.value_tier]||0)-(VALUE_RANK[b.p.value_tier]||0) || (a.p.distance_km||0)-(b.p.distance_km||0);
    case "name": return (a.p.name||"").localeCompare(b.p.name||"");
    case "rank": return (a.p.rank||1e9)-(b.p.rank||1e9) || (a.p.distance_km||0)-(b.p.distance_km||0);
    default: return (a.p.distance_km||0)-(b.p.distance_km||0);
  }
}
function apply(){
  const vis=REC.filter(r=>matches(r.p)); vis.sort(sortFn);
  // markers
  markerLayer.clearLayers();
  const bounds=[[HOME.lat,HOME.lng]];
  vis.forEach(r=>{markerLayer.addLayer(r.marker); bounds.push([r.p.lat,r.p.lng]);});
  // list (in sorted order)
  listEl.innerHTML="";
  vis.forEach(r=>listEl.appendChild(r.card));
  document.getElementById("shown").textContent=vis.length;
  document.getElementById("listhead").textContent=vis.length+" places — sorted by "+document.getElementById("f-sort").selectedOptions[0].text.toLowerCase();
  if(vis.length && bounds.length>1) map.fitBounds(bounds,{padding:[40,40],maxZoom:14});
}

/* ---------- legend + mobile menu ---------- */
const legend=L.control({position:"bottomright"});
legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");
  d.innerHTML='<span class="dot" style="background:#9e0023"></span>Star<br>'+
  '<span class="dot" style="background:#e07b00"></span>Bib Gourmand (value)<br>'+
  '<span class="dot" style="background:#2f7fd6"></span>Unrated (often best value)<br>'+
  '<span class="dot" style="background:#6b3fa0"></span>Café';
  L.DomEvent.disableClickPropagation(d); return d;};
legend.addTo(map);

const sidebar=document.getElementById("sidebar");
document.getElementById("menuBtn").onclick=()=>sidebar.classList.toggle("open");

/* initial sort: if any place has a rank (shortlist), default to rank view */
if(PLACES.some(p=>p.rank)){ F.sort="rank"; document.getElementById("f-sort").value="rank"; }
apply();
</script>
